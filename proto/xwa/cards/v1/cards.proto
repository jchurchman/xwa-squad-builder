syntax = "proto3";

package xwa.cards.v1;

option go_package = "github.com/jchurchman/xwa-squad-builder/backend/gen/xwa/cards/v1;cardsv1";

// CardService serves card definitions imported from the xwing-data2 fork.
service CardService {
  // ListShips returns every ship flown by a faction, each with that faction's pilots.
  rpc ListShips(ListShipsRequest) returns (ListShipsResponse);
  // ListUpgrades returns every upgrade card. Restrictions decide which ones a ship can equip.
  rpc ListUpgrades(ListUpgradesRequest) returns (ListUpgradesResponse);
}

message ListShipsRequest {
  // XWS faction ID, e.g. "rebelalliance".
  string faction_xws = 1;
}

message ListShipsResponse {
  repeated Ship ships = 1;
}

message ListUpgradesRequest {}

message ListUpgradesResponse {
  repeated Upgrade upgrades = 1;
}

message Ship {
  string xws = 1;
  string name = 2;
  repeated Pilot pilots = 3;
  // "Small", "Medium", "Large", or "Huge".
  string size = 4;
  repeated Action actions = 5;
  // Arcs the ship has a primary attack in, e.g. "Front Arc", "Rear Arc".
  repeated string arcs = 6;
}

message Pilot {
  string xws = 1;
  string name = 2;
  int32 initiative = 3;
  // Maximum copies of this card name in a squad. 0 means no limit.
  int32 limited = 4;
  // Upgrade slots, e.g. "Talent", "Torpedo". Empty for standard loadout pilots.
  // Read from the card data until points versions exist.
  repeated string slots = 5;
  // Upgrade XWS IDs a standard loadout pilot always flies with.
  repeated string standard_loadout = 6;
  repeated string keywords = 7;
  // Name of the pilot's ship ability, e.g. "Autothrusters". Empty if none.
  string ship_ability = 8;
  // Replaces the ship's actions for this pilot when not empty.
  repeated Action ship_actions = 9;
  // "light" and/or "dark" for Force users.
  repeated string force_sides = 10;
}

message Action {
  string type = 1;
  // "White", "Red", etc.
  string difficulty = 2;
}

message Upgrade {
  string xws = 1;
  string name = 2;
  // Every slot the upgrade occupies. The first is the slot it is chosen from.
  repeated string slots = 3;
  // Maximum copies of this card name in a squad. 0 means no limit.
  int32 limited = 4;
  // Only available as part of a standard loadout, never chosen directly.
  bool standard_loadout_only = 5;
  // A ship can equip the upgrade only if it meets every group.
  repeated RestrictionGroup restrictions = 6;
}

// A ship meets a group if it meets at least one of the conditions set in it.
message RestrictionGroup {
  repeated string factions = 1;
  // Ship XWS IDs.
  repeated string ships = 2;
  repeated string sizes = 3;
  // An action the ship has. A difficulty, when set, must also match.
  repeated Action actions = 4;
  repeated string keywords = 5;
  repeated string ship_abilities = 6;
  // Card names that must be in the squad.
  repeated string names = 7;
  // Upgrade slot types that must already be filled on the ship.
  repeated string equipped = 8;
  repeated string arcs = 9;
  repeated string force_sides = 10;
  bool solitary = 11;
  // Recorded but not enforced yet: these apply to the whole list, not one ship.
  bool standardized = 12;
  optional bool non_limited = 13;
}
