# Generates Go and TypeScript code from proto/. Run `npm run generate` after editing a .proto file.
version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: backend/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: backend/gen
    opt: paths=source_relative
  # Keep this version in step with @bufbuild/protobuf in client/package.json.
  - remote: buf.build/bufbuild/es:v2.16.0
    out: client/src/gen
    opt: target=ts
